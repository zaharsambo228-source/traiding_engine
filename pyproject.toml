[project]
name = "traiding_engine"
version = "0.1.0"
description = "A sophisticated trading engine with ML capabilities"
authors = [
    {name = "Quant", email = "quant@example.com"},
]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "ccxt>=4.0.0",
    "lightgbm>=4.0.0",
    "scikit-learn>=1.3.0",
    "ta>=0.10.2",
    "joblib>=1.3.0",
    "pyarrow>=12.0.0",
    "fastparquet>=2023.0.0",
]
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "pytest>=7.0.0",
    "pandas-stubs>=2.0.0",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = []

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
pythonpath = "."
